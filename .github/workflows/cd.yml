name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-scan-push:
    # Only a green CI run for a push to this repository's main branch reaches
    # this job. Manual runs are limited to main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        run: |
          docker buildx version
          docker buildx create --name immoradar-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      # Images stay local until the vulnerability gates below pass.
      - name: Build images locally
        run: |
          for image in api worker-scraper worker-processing; do
            docker buildx build \
              --file "apps/$image/Dockerfile" \
              --tag "$IMAGE_PREFIX/$image:$IMAGE_SHA" \
              --cache-from "type=registry,ref=$IMAGE_PREFIX/$image-buildcache:main" \
              --sbom=false \
              --provenance=false \
              --load \
              .
          done

      - name: Prepare scan artifact directory
        run: mkdir -p .trivy

      - name: Generate API SARIF report
        id: report_api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE_PREFIX }}/api:${{ env.IMAGE_SHA }}
          format: sarif
          output: .trivy/api.sarif
          exit-code: 0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          cache: false

      - name: Generate worker-scraper SARIF report
        id: report_worker_scraper
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE_PREFIX }}/worker-scraper:${{ env.IMAGE_SHA }}
          format: sarif
          output: .trivy/worker-scraper.sarif
          exit-code: 0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          cache: false

      - name: Generate worker-processing SARIF report
        id: report_worker_processing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE_PREFIX }}/worker-processing:${{ env.IMAGE_SHA }}
          format: sarif
          output: .trivy/worker-processing.sarif
          exit-code: 0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          cache: false

      - name: Upload API SARIF to code scanning
        if: always() && hashFiles('.trivy/api.sarif') != ''
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675
        with:
          sarif_file: .trivy/api.sarif
          category: container-api
          ref: refs/heads/main
          sha: ${{ env.IMAGE_SHA }}

      - name: Upload worker-scraper SARIF to code scanning
        if: always() && hashFiles('.trivy/worker-scraper.sarif') != ''
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675
        with:
          sarif_file: .trivy/worker-scraper.sarif
          category: container-worker-scraper
          ref: refs/heads/main
          sha: ${{ env.IMAGE_SHA }}

      - name: Upload worker-processing SARIF to code scanning
        if: always() && hashFiles('.trivy/worker-processing.sarif') != ''
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675
        with:
          sarif_file: .trivy/worker-processing.sarif
          category: container-worker-processing
          ref: refs/heads/main
          sha: ${{ env.IMAGE_SHA }}

      - name: Enforce API vulnerability gate
        id: scan_api
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE_PREFIX }}/api:${{ env.IMAGE_SHA }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          cache: false
          skip-setup-trivy: true

      - name: Enforce worker-scraper vulnerability gate
        id: scan_worker_scraper
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE_PREFIX }}/worker-scraper:${{ env.IMAGE_SHA }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          cache: false
          skip-setup-trivy: true

      - name: Enforce worker-processing vulnerability gate
        id: scan_worker_processing
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE_PREFIX }}/worker-processing:${{ env.IMAGE_SHA }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          cache: false
          skip-setup-trivy: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: trivy-scan-results
          path: .trivy/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail if any image scan reported HIGH/CRITICAL vulnerabilities
        if: always()
        run: |
          if [ "${{ steps.scan_api.outcome }}" != "success" ] || \
             [ "${{ steps.scan_worker_scraper.outcome }}" != "success" ] || \
             [ "${{ steps.scan_worker_processing.outcome }}" != "success" ]; then
            echo "One or more container scans failed."
            exit 1
          fi

      # The builder's local cache supplies the scanned layers, so this adds the
      # SBOM and provenance attestations without changing what was scanned.
      - name: Push scanned images
        run: |
          for image in api worker-scraper worker-processing; do
            docker buildx build \
              --file "apps/$image/Dockerfile" \
              --tag "$IMAGE_PREFIX/$image:$IMAGE_SHA" \
              --tag "$IMAGE_PREFIX/$image:latest" \
              --cache-from "type=registry,ref=$IMAGE_PREFIX/$image-buildcache:main" \
              --cache-to "type=registry,ref=$IMAGE_PREFIX/$image-buildcache:main,mode=max" \
              --sbom=true \
              --provenance=true \
              --push \
              .
          done
